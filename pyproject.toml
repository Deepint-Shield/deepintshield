[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepintshield"
version = "2.8.0"
description = "Unified Python SDK for routing chat, RAG, agentic tool-gating, identity, and MCP traffic through DeepintShield - drop-in across the top agentic frameworks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "DeepintShield" }]
keywords = ["llm", "agent", "security", "guardrails", "pep", "pdp", "agentic", "deepintshield", "entra", "langgraph", "crewai"]
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.0",
  "openai>=2.32.0,<4",
]

[project.optional-dependencies]
openai = ["openai>=2.32.0,<4"]
anthropic = ["anthropic>=0.51.0"]
bedrock = ["boto3>=1.37.0"]
genai = ["google-genai>=1.12.1"]
litellm = ["litellm>=1.67.0"]
langchain = [
  "langchain-core>=0.3.55",
  "langchain-openai>=0.3.14",
]
langgraph = [
  "langchain-core>=0.3.55",
  "langchain-openai>=0.3.14",
  "langgraph>=0.4.2",
]
pydanticai = ["pydantic-ai-slim[openai]>=2.41.0,<3"]
crewai = ["crewai[openai]>=1.15.20,<2"]
openai-agents = [
  "openai-agents>=0.22.1,<1",
  "mcp>=1.29,<2",
]
llamaindex = ["llama-index-llms-openai-like>=0.8.0,<1", "llama-index-embeddings-openai-like>=0.4.0,<1"]
autogen = ["autogen-agentchat>=0.7.5,<1", "autogen-ext[openai]>=0.7.5,<1"]
temporal = ["temporalio>=1.32.0,<2"]
strands = ["strands-agents[openai]>=1.55.0,<2"]
google-adk = ["google-adk>=1.39.1,<2", "litellm>=1.100.0,<2"]
azure = ["azure-identity>=1.16.0"]
# Proof-of-possession (DPoP, RFC 9449) for agent workload tokens. Optional
# because a deployment whose identity provider does not bind tokens has nothing
# to prove possession of, and should not be made to carry a crypto dependency.
dpop = ["cryptography>=42.0.0"]
mcp = ["mcp>=1.29,<2"]
langchain-mcp = [
  "langchain-mcp-adapters>=0.3.2,<0.4",
  "mcp>=1.29,<2",
]
anthropic-mcp = [
  "anthropic[mcp]>=0.120.2,<1",
  "mcp>=1.29,<2",
]
all = [
  "openai>=1.75.0",
  "anthropic[mcp]>=0.120.2,<1",
  "boto3>=1.37.0",
  "google-genai>=1.12.1",
  "litellm>=1.67.0",
  "langchain-core>=0.3.55",
  "langchain-openai>=0.3.14",
  "langchain-mcp-adapters>=0.3.2,<0.4",
  "langgraph>=0.4.2",
  "pydantic-ai>=0.1.1",
  "crewai>=0.70.0",
  "openai-agents>=0.21,<1",
  "mcp>=1.29,<2",
  "llama-index>=0.11.0",
  "autogen-agentchat>=0.4.0",
  "autogen-ext[openai]>=0.4.0",
  "temporalio>=1.7.0",
  "strands-agents>=0.1.0",
  "google-adk>=0.1.0",
  "azure-identity>=1.16.0",
  "cryptography>=42.0.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://app.deepintshield.com"
Documentation = "https://aidocs.deepintshield.com"
Examples = "https://github.com/deepintai/deepintshield/tree/main/examples"
Source = "https://github.com/deepintai/deepintshield"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
